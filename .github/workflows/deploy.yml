name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 连续 push 时只保留最新一次部署，取消排队中的旧构建
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      # 测试不通过就不发布：线上永远是能跑的版本
      - name: Test
        working-directory: app
        run: npm test

      - name: Build
        working-directory: app
        run: npm run build

      # 需要仓库已开启 Pages（Source = GitHub Actions）。
      # 用 GITHUB_TOKEN 无法创建 Pages site（Resource not accessible by integration），
      # 所以首次开启必须手动在 Settings → Pages 完成。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
